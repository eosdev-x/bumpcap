<!DOCTYPE busconfig PUBLIC
 "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.bumpcap.Helper1"/>
  </policy>

  <policy context="default">
    <allow send_destination="org.bumpcap.Helper1"
           send_interface="org.bumpcap.Helper1"
           send_member="EnableCopr"/>
    <allow send_destination="org.bumpcap.Helper1"
           send_interface="org.bumpcap.Helper1"
           send_member="DisableCopr"/>
    <allow send_destination="org.bumpcap.Helper1"
           send_interface="org.bumpcap.Helper1"
           send_member="SetDefaultKernel"/>
    <allow send_destination="org.bumpcap.Helper1"
           send_interface="org.bumpcap.Helper1"
           send_member="RegenerateGrubConfig"/>
    <allow send_destination="org.bumpcap.Helper1"
           send_interface="org.bumpcap.Helper1"
           send_member="RebootIntoKernelOnce"/>
    <allow send_destination="org.bumpcap.Helper1"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="org.bumpcap.Helper1"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="org.bumpcap.Helper1"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
